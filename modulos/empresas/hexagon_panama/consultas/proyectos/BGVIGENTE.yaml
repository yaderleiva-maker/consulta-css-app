proyecto: BGVIGENTES
descripcion: "Transformación de gestiones VICI para Banco General"

# ============================================================
# 1. CONFIGURACIÓN VICI
# ============================================================
vici:
  cuenta: DEPRESTAMO
  telefono: phone_number
  asesor: User
  fecha_gestion: modify_date
  codigo_resultado: status

# ============================================================
# 2. MOTOR DE TRANSFORMACIONES ⚙️ (NUEVO)
# ============================================================
transformaciones:
  status:
    tipo: insertar_punto
    excepciones:
      - "TIMEOT"
      - "AL"        # AL también es excepción (según Access)
    descripcion: "Inserta punto después del primer carácter"
  
  # Futuras transformaciones:
  # fecha_gestion:
  #   tipo: formato_access
  #   formato: "MM-DD-YYYY"

# ============================================================
# 3. TIPOLOGÍA (Códigos ya transformados)
# ============================================================
tipologia:
  # Contactos exitosos (Prioridad 1)
  "b.OP": "b.OP-Obtuvo promesa"
  "y.CINPA": "y.CINPA-Cliente con intención de pago"
  "c.RPAG": "c.RPAG-Recordatorio de pago"
  "r.COPRP": "r.COPRP-Codeudor promesa de pago"
  "q.COAV": "q.COAV-Codeudor avisado"
  "f.CNDP": "f.CNDP-Cliente no da promesa"
  "l.CNRM": "l.CNRM-Cliente no reconoce mora/saldo"
  "o.AAF": "o.AAF-Avisado a familiar"
  "x.CM": "x.CM-Cliente molesto"
  
  # Contactos con terceros (Prioridad 2)
  "v.TERC": "v.TERC-Terceros"
  "s.COSDM": "s.COSDM-Codeudor se deja mensaje"
  "t.COSDM": "t.COSDM-Codeudor no contesta"
  
  # No contactos (Prioridad 3-4)
  "d.CRIN": "d.CRIN-Cliente renuente o insolvente"
  "e.CCL": "e.CCL-Cliente cuelga llamada"
  "h.NC": "h.NC-No contesta"
  "g.MC": "g.MC-Mensaje Contestador"
  "i.NINEX": "i.NINEX-Número inexistente"
  "j.NFDS": "j.NFDS-Número Fuera de Servicio"
  "k.OC": "k.OC-Ocupado"
  "m.TNCAT": "m.TNCAT-Teléfono no corresponde al titular"
  "VDAD": "VDAD"
  "TIMEOT": "g.MC-Mensaje Contestador"

# ============================================================
# 4. REGLAS DE NEGOCIO
# ============================================================
reglas:
  asesores:
    # Mapeo de usuarios si es necesario
  
  comentario:
    formato: "{telefono} {resultado}"
  
  campo_proyecto:
    nombre: "BGVIGENTES"
    formato: "BGVIGENTES::::{cuenta}"

# ============================================================
# 5. FALLBACKS
# ============================================================
fallbacks:
  estado_cuenta: "No contacto"

# ============================================================
# 6. METADATOS PARA REPORTES
# ============================================================
arbol_tipologias:
  "b.OP":
    codigo_jamar: "89"
    contactabilidad: "COMPROMISO DE PAGO"
    es_promesa: true
    prioridad: 1
  # ... (todos los códigos mapeados)

predemanda:
  grupos_resultado:
    "COMPROMISO DE PAGO":
      prioridad: 1
      codigos_jamar: ["89", "01", "88"]
    "CONTACTO EFECTIVO":
      prioridad: 2
      codigos_jamar: ["14", "81", "90", "84"]
    "CONTACTO CON TERCERO":
      prioridad: 3
      codigos_jamar: ["00", "0"]
    "NO CONTACTOS":
      prioridad: 4
      codigos_jamar: ["83", "11", "15", "86", "10"]
