proyecto: JAMAR
descripcion: "Configuración integral del proyecto JAMAR (Transformación VICI, Validaciones y Reportería)"

# ============================================================
# 1. TRANSFORMADOR: VICI -> CRM (herramientas/convertidor.py)
# ============================================================
vici:
  cuenta: city
  telefono: phone_number
  asesor: user
  fecha_gestion: modify_date
  codigo_resultado: status

tipologia:
  AA: "No contesta"
  AB: "Tono ocupado / no da tono"
  ADC: "Tono ocupado / no da tono"
  BZN: "No contesta"
  CLL: "Cuelga llamada"
  NA: "No contesta"
  NMQ: "Equivocado"
  NRP: "No contesta"

reglas:
  asesores:
    VDAD: "nalvarado"
    vdad: "nalvarado"
  comentario:
    formato: "{telefono} {resultado}"
  campo_proyecto:
    nombre: "JAMAR"
    formato: "JAMAR::::{cuenta}"

crm:
  requiere:
    - fecha_reprogramacion
    - estado_cuenta

fallbacks:
  fecha_reprogramacion: "created_at + 1 day"
  estado_cuenta: "No contacto"

# ============================================================
# 2. VALIDADOR DE GESTIONES (cobranza/gestiones_diarias/)
# ============================================================
validaciones:
  comentario_obligatorio: true
  numero_contacto_obligatorio: true
  resultado_obligatorio: true
  promesa:
    requiere_fecha: true
    requiere_monto: true
    fecha_no_puede_ser_anterior_a_gestion: true
  comentario_no_contesta:
    validar_contra_resultado: true

